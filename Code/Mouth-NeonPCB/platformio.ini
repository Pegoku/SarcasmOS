[platformio]
src_dir = .
default_envs = custom_esp32s3_mini_n8

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
extra_scripts = pre:asset_build.py
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    https://github.com/mrcodetastic/ESP32-HUB75-MatrixPanel-DMA.git
    adafruit/Adafruit GFX Library

[env:custom_esp32s3_mini_n8]
build_src_filter =
    +<main.cpp>
    +<mouth_display.cpp>
build_flags =
    ${env.build_flags}
    -DESPNOW_CHANNEL=1

[env:local_animation_test]
build_src_filter =
    +<local_test.cpp>
    +<mouth_display.cpp>
